name: Hero Preview

on:
  push:
    branches:
      - feat/hero-ecosystem-v2

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, fileinfo, sqlite, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install and build frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Install Chromium for preview
        run: npx --yes playwright@1.55.0 install --with-deps chromium

      - name: Start Mevzun website
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/mevzun-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/mevzun-preview.log
          exit 1

      - name: Capture light and dark hero previews
        run: |
          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --color-scheme=light --wait-for-timeout=1200 http://127.0.0.1:8000 hero-light.png
          npx --yes playwright@1.55.0 screenshot --viewport-size="1920,1080" --color-scheme=dark --wait-for-timeout=1200 http://127.0.0.1:8000 hero-dark.png

      - name: Upload hero previews
        uses: actions/upload-artifact@v4
        with:
          name: hero-previews
          path: |
            hero-light.png
            hero-dark.png
          if-no-files-found: error
          retention-days: 1
